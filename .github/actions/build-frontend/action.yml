name: Build Komari web bundles
description: Build the isolated system UI and the official default public theme from third_party/komari-web, then optionally upload both as an artifact.

inputs:
  node-version:
    description: Node.js version used to build komari-web.
    default: "24"
  source-dir:
    description: Submodule directory containing komari-web.
    default: third_party/komari-web
  ref:
    description: Optional Komari Web ref to checkout. If omitted or latest, uses the pinned submodule.
    default: ""
  artifact-name:
    description: Optional artifact name for the packed system UI.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build Komari web bundles
      shell: bash
      env:
        WEB_SOURCE_DIR: ${{ inputs.source-dir }}
        KOMARI_WEB_REF: ${{ inputs.ref }}
      run: |
        set -euxo pipefail
        web_dir="$WEB_SOURCE_DIR"

        if [ ! -f "$web_dir/package.json" ]; then
          echo "Submodule not initialized at $web_dir, attempting git submodule update..."
          git submodule update --init --recursive "$web_dir"
        fi

        requested_ref="$KOMARI_WEB_REF"
        if [ -n "$requested_ref" ] && [ "$requested_ref" != "latest" ]; then
          echo "Switching $web_dir to requested ref $requested_ref"
          cd "$web_dir"
          git fetch --depth=1 origin "$requested_ref" || git fetch origin "$requested_ref"
          git checkout "$requested_ref"
          cd -
        fi

        # Ref overrides may introduce a different nested protocol gitlink.
        git -C "$web_dir" submodule update --init --recursive
        node "$web_dir/scripts/ci/check-protocol.cjs"
        backend_proto="$(git -C third_party/komari-proto rev-parse HEAD)"
        web_proto="$(git -C "$web_dir/third_party/komari-proto" rev-parse HEAD)"
        if [ "$backend_proto" != "$web_proto" ]; then
          echo "Backend/Web protocol commits differ: $backend_proto / $web_proto" >&2
          exit 1
        fi

        echo "Building Komari Web bundles from $web_dir..."
        cd "$web_dir"
        bash "$GITHUB_WORKSPACE/scripts/ci/run-audit-check.sh" web-install npm ci --no-audit
        bash "$GITHUB_WORKSPACE/scripts/ci/run-audit-check.sh" web-dependency-security npm run test:dependency-security
        bash "$GITHUB_WORKSPACE/scripts/ci/run-audit-check.sh" web-dependency-audit npm run audit:security
        npm run lint
        npm test
        npm run build:system
        cd -

        rm -rf web/public/systemUI
        mkdir -p web/public/systemUI
        cp -r "$web_dir/dist" web/public/systemUI/

        grep -F '/system-assets/' web/public/systemUI/dist/index.html

        cd "$web_dir"
        npm run build
        cd -

        rm -rf web/public/bundledThemes/default
        mkdir -p web/public/bundledThemes/default
        cp "$web_dir/komari-theme.json" web/public/bundledThemes/default/
        cp -r "$web_dir/dist" web/public/bundledThemes/default/

        grep -F '/assets/' web/public/bundledThemes/default/dist/index.html
        test -f web/public/bundledThemes/default/komari-theme.json
        test -f web/public/bundledThemes/nezha/komari-theme.json
        test -f web/public/bundledThemes/nezha/dist/index.html
        test -f web/public/rescueTheme/dist/index.html

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" \
          -C web/public systemUI bundledThemes/default

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
