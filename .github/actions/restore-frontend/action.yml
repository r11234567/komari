name: Restore Komari web bundles
description: Download and unpack the system UI and official default public theme artifact.

inputs:
  artifact-name:
    description: System UI artifact name.
    default: komari-frontend

runs:
  using: composite
  steps:
    - name: Download frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/frontend-artifact

    - name: Extract frontend artifact
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf web/public/systemUI web/public/bundledThemes/default
        mkdir -p web/public
        tar -xzf "$RUNNER_TEMP/frontend-artifact/${{ inputs.artifact-name }}.tar.gz" -C web/public
        grep -F '/system-assets/' web/public/systemUI/dist/index.html
        grep -F '/assets/' web/public/bundledThemes/default/dist/index.html
        test -f web/public/bundledThemes/default/komari-theme.json
