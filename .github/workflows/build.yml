name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Prepare module metadata patch for manual validation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          go mod tidy
          git diff --binary -- go.mod go.sum > "${RUNNER_TEMP}/go-mod-tidy.patch"

      - name: Upload module metadata patch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: go-mod-tidy-patch
          path: ${{ runner.temp }}/go-mod-tidy.patch

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            printf 'Files requiring gofmt:\n%s\n' "${unformatted}" >&2
            exit 1
          fi

      - name: Run backend tests
        run: go test ./...

  external-databases:
    name: MySQL and PostgreSQL integration
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: komari
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d komari"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: komari
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run database integration tests
        env:
          METRIC_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/komari?parseTime=true
          METRIC_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/komari?sslmode=disable
        run: go test ./pkg/metric -run 'Test(MySQL|PostgreSQL)Integration' -count=1 -v

  frontend:
    name: Frontend lint, tests, and build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build frontend artifact
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: komari-frontend

  compile:
    name: Compile application
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore frontend artifact
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Compile native CI binary
        env:
          GIN_MODE: release
        run: go build -trimpath -o "${RUNNER_TEMP}/komari-ci"
