name: Agent credential lifecycle stages
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: credential-lifecycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stage-one:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
      KOMARI_SECRET_KEY: isolated-ci-credential-lifecycle-key
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Transactional rotation and recovery against real SQLite
        run: bash scripts/ci/run-audit-check.sh credential-rotation bash scripts/ci/run-go-tests.sh -race ./database/enrollment
      - name: Real Connect proof and compatibility assertions
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-refresh-connect bash scripts/ci/run-go-tests.sh -race -run 'TestCredentialRefreshV2|TestDualEnd_RefreshCredentials' ./web/connect
      - name: Repeat competing database writers twenty times
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-rotation-repeat bash scripts/ci/run-go-tests.sh -race -count=20 -run '^TestCredentialRotationConcurrentSameRequestHasOneResult$' ./database/enrollment
      - name: Require actual passing assertions with no skips
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-evidence python3 scripts/ci/check-credential-lifecycle.py
      - name: Prove lost-response test detects broken recovery
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-negative-control bash scripts/ci/test-credential-recovery-negative.sh
      - name: Preserve all output including expected negative-control failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: error

  stage-two-integration:
    needs: stage-one
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      GOMEMLIMIT: 3GiB
      KOMARI_SECRET_KEY: isolated-ci-credential-lifecycle-key
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Read immutable Agent revision
        id: agent
        run: |
          revision=$(cat scripts/ci/credential-agent-revision.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: r11234567/komari-agent
          ref: ${{ steps.agent.outputs.revision }}
          path: credential-agent
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Actual Agent signature, lost response, restart, next generation and revocation
        run: bash scripts/ci/run-audit-check.sh credential-actual-agent bash scripts/ci/run-credential-integration.sh
      - name: Require non-skipped real cross-repository test
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          p=Path('ci-artifacts/credential-actual-agent-go/tests.jsonl')
          events=[json.loads(s) for s in p.read_text().splitlines() if s.strip()]
          name='TestCredentialLifecycleActualAgentLostResponseAndRestart'
          assert any(e.get('Action')=='pass' and e.get('Test')==name for e in events)
          assert not any(e.get('Action') in ('fail','skip') for e in events)
          print('Observed actual backend + pinned Agent recovery assertion')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-actual-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: error
