name: Credentials and workspace
on:
  workflow_call:
permissions:
  contents: read
jobs:
  credentials:
    name: Credential rotation, workspace authorization and scoped tokens
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Transactional rotation and recovery against real SQLite
        run: bash scripts/ci/run-audit-check.sh credential-rotation bash scripts/ci/run-go-tests.sh -race ./database/enrollment
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
          KOMARI_SECRET_KEY: isolated-ci-credential-lifecycle-key
      - name: Real Connect proof and compatibility assertions
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-refresh-connect bash scripts/ci/run-go-tests.sh -race -run 'TestCredentialRefreshV2|TestDualEnd_RefreshCredentials|TestCredentialLifecycle'
          ./web/connect
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
          KOMARI_SECRET_KEY: isolated-ci-credential-lifecycle-key
      - name: Repeat competing database writers twenty times
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-rotation-repeat bash scripts/ci/run-go-tests.sh -race -count=20 -run '^TestCredentialRotationConcurrentSameRequestHasOneResult$'
          ./database/enrollment
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
          KOMARI_SECRET_KEY: isolated-ci-credential-lifecycle-key
      - name: Require actual passing assertions with no skips
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-evidence python3 scripts/ci/check-credential-lifecycle.py
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
          KOMARI_SECRET_KEY: isolated-ci-credential-lifecycle-key
      - name: Prove lost-response test detects broken recovery
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-negative-control bash scripts/ci/test-credential-recovery-negative.sh
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
          KOMARI_SECRET_KEY: isolated-ci-credential-lifecycle-key
      - name: Preserve all output including expected negative-control failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Start a fresh log directory after rotation
        if: always()
        shell: bash
        run: |-
          if [ -d ci-artifacts ]; then mv ci-artifacts "$RUNNER_TEMP/rotation-ci-artifacts"; fi
          mkdir -p ci-artifacts
      - name: Absolute and idle deadlines, scope, logout and stream cancellation
        run: bash scripts/ci/run-audit-check.sh workspace bash scripts/ci/run-go-tests.sh ./web/signonauth ./web/workspace ./web/connect ./web/filemanager
          ./web/remotemanagement
      - name: RPC2 compatibility allowlist and 2FA boundaries
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh gateway bash scripts/ci/run-go-tests.sh ./web/rpc/jsonrpc ./web/api ./web/router
      - name: Grant cancellation and terminal closure races
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh workspace-race bash scripts/ci/run-go-tests.sh -race ./web/workspace ./web/remotemanagement
      - name: Install Nginx for the isolated transport component checkpoint
        if: ${{ !cancelled() }}
        run: |
          bash scripts/ci/run-audit-check.sh nginx-install bash -c 'sudo apt-get update && sudo apt-get install -y nginx'
          bash scripts/ci/run-audit-check.sh nginx-version nginx -V
      - name: File lease and duplex handshake through actual Nginx (no browser E2E)
        if: ${{ !cancelled() }}
        env:
          KOMARI_NGINX_COMPONENT_TEST: '1'
        run: bash scripts/ci/run-audit-check.sh workbench-proxy bash scripts/ci/run-go-tests.sh -run '^TestWorkbenchNginxFileLeaseAndDuplexAttach$'
          ./web/connect
      - name: Real signed backend heartbeats beyond 30s through Nginx and live revocation
        if: ${{ !cancelled() }}
        env:
          KOMARI_NGINX_COMPONENT_TEST: '1'
        run: bash scripts/ci/run-audit-check.sh rescue-watch-proxy bash scripts/ci/run-go-tests.sh -race -run '^TestRescueWatch' ./web/connect
      - name: Reject missing, skipped or shortened rescue transport tests
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh rescue-watch-evidence python3 scripts/ci/check-rescue-watch-results.py ci-artifacts/rescue-watch-proxy-go
      - name: Prove missing Nginx watch override fails the actual stream
        if: ${{ !cancelled() }}
        env:
          KOMARI_NGINX_COMPONENT_TEST: '1'
        run: bash scripts/ci/run-audit-check.sh rescue-watch-negative-control bash scripts/ci/test-rescue-watch-negative-control.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-auth-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
      - name: Start a fresh log directory after authorization
        if: always()
        shell: bash
        run: |-
          if [ -d ci-artifacts ]; then mv ci-artifacts "$RUNNER_TEMP/authorization-ci-artifacts"; fi
          mkdir -p ci-artifacts
      - name: Token verifier, policy, real SQLite pollution and existing security boundaries
        run: bash scripts/ci/run-audit-check.sh api-security bash scripts/ci/run-go-tests.sh -race ./database/apitokens ./database/clients ./database/accounts
          ./web/security ./pkg/rpc
      - name: Read-only inspection of pre-existing quota pollution
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh quota-audit python3 -m unittest discover -s scripts/tests -p test_audit_traffic_limits.py -v
      - name: Consolidated seven-advisory matrix (missing and skipped tests fail)
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s scripts/tests -p test_security_advisory_matrix.py -v
          python3 scripts/ci/run-security-advisories.py ci-artifacts/security-advisories
      - name: Native proof binding, HTTP token isolation and actual quiet terminal streams
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh api-connect bash scripts/ci/run-go-tests.sh -race -run 'Test(Policy|ApiToken|ApiKey|ApiAuthentication|WebSSHCold|Workspace|TrustedAction|ConnectMetricQuery)'
          ./web/connect
      - name: Legacy RPC and sensitive principal regressions
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh api-gateway bash scripts/ci/run-go-tests.sh ./web/api ./web/rpc/jsonrpc ./web/remotemanagement
      - name: Install Nginx for the isolated cold-start component check
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh startup-nginx-install bash -c 'sudo apt-get update && sudo apt-get install -y nginx'
      - name: Real quiet WebSSH streams and revocation through checked-in Nginx routes
        if: ${{ !cancelled() }}
        env:
          KOMARI_NGINX_COMPONENT_TEST: '1'
        run: bash scripts/ci/run-audit-check.sh startup-nginx bash scripts/ci/run-go-tests.sh -race -run '^TestWebSSHColdStartupNginx$' ./web/connect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-api-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: error
  agent:
    name: Pinned Agent integration and workspace diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Read immutable Agent revision
        id: agent
        run: |
          revision=$(cat scripts/ci/credential-agent-revision.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
        env:
          GOMAXPROCS: '2'
          CGO_ENABLED: '1'
          GOMEMLIMIT: 3GiB
          KOMARI_SECRET_KEY: isolated-ci-credential-lifecycle-key
      - uses: actions/checkout@v4
        with:
          repository: r11234567/komari-agent
          ref: ${{ steps.agent.outputs.revision }}
          path: credential-agent
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: credential-agent/go.mod
      - name: Actual Agent signature, lost response, restart, next generation and revocation
        run: bash scripts/ci/run-audit-check.sh credential-actual-agent bash scripts/ci/run-credential-integration.sh
        env:
          GOMAXPROCS: '2'
          CGO_ENABLED: '1'
          GOMEMLIMIT: 3GiB
          KOMARI_SECRET_KEY: isolated-ci-credential-lifecycle-key
      - name: Require non-skipped real cross-repository test
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          p=Path('ci-artifacts/credential-actual-agent-go/tests.jsonl')
          events=[json.loads(s) for s in p.read_text().splitlines() if s.strip()]
          name='TestCredentialLifecycleActualAgentLostResponseAndRestart'
          assert any(e.get('Action')=='pass' and e.get('Test')==name for e in events)
          assert not any(e.get('Action') in ('fail','skip') for e in events)
          print('Observed actual backend + pinned Agent recovery assertion')
          PYCODE
        env:
          GOMAXPROCS: '2'
          CGO_ENABLED: '1'
          GOMEMLIMIT: 3GiB
          KOMARI_SECRET_KEY: isolated-ci-credential-lifecycle-key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-actual-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Start a fresh log directory after credential-agent
        if: always()
        shell: bash
        run: |-
          if [ -d ci-artifacts ]; then mv ci-artifacts "$RUNNER_TEMP/credential-agent-ci-artifacts"; fi
          mkdir -p ci-artifacts
      - name: Read exact Agent dependency commit
        id: dependency
        run: |
          revision=$(cat scripts/ci/workspace-agent-revision.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
          CGO_ENABLED: '1'
      - uses: actions/checkout@v4
        with:
          repository: r11234567/komari-agent
          ref: ${{ steps.dependency.outputs.revision }}
          path: workspace-agent
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: workspace-agent/go.mod
      - name: Real signed rescue stream, replay rejection and existing host boundaries
        run: bash scripts/ci/run-audit-check.sh agent-rescue bash -c 'cd workspace-agent && bash scripts/ci/run-go-tests.sh -race ./rescue ./core/hostops
          ./clientcore ./internal/hostcmd'
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
          CGO_ENABLED: '1'
      - name: Require actual non-skipped Agent stream and denial assertions
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh agent-rescue-evidence python3 scripts/ci/check-workspace-agent-results.py ci-artifacts/agent-rescue-go
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
          CGO_ENABLED: '1'
      - name: Preserve complete Agent command and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Start a fresh log directory after rescue
        if: always()
        shell: bash
        run: |-
          if [ -d ci-artifacts ]; then mv ci-artifacts "$RUNNER_TEMP/rescue-ci-artifacts"; fi
          mkdir -p ci-artifacts
      - name: Actual machine isolation, cancellation, renewal and consumer cleanup
        run: bash scripts/ci/run-audit-check.sh workspace-state node --test --test-reporter=tap third_party/komari-web/tests/workspaceState.test.ts
          third_party/komari-web/tests/workspacePeers.test.ts
      - name: Install locked application dependencies for component units
        run: bash scripts/ci/run-audit-check.sh workspace-unit-install npm --prefix third_party/komari-web ci --no-audit
      - name: Install pinned CI-only DOM implementation (no browser or E2E)
        run: bash scripts/ci/run-audit-check.sh workspace-dom-install npm --prefix third_party/komari-web install --no-save --package-lock=false
          --ignore-scripts --no-audit jsdom@26.1.0
      - name: Real React effects, Xterm renderer retention and cross-machine cancellation
        run: bash scripts/ci/run-audit-check.sh workspace-components node --import ./third_party/komari-web/tests/workspace/register.mjs --test
          --test-reporter=tap third_party/komari-web/tests/workspace/components.test.ts
      - name: Preserve complete output and original exit code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Start a fresh log directory after workspace-ui
        if: always()
        shell: bash
        run: |-
          if [ -d ci-artifacts ]; then mv ci-artifacts "$RUNNER_TEMP/workspace-ui-ci-artifacts"; fi
          mkdir -p ci-artifacts
      - name: Verify failure propagation and complete failure artifacts (negative controls)
        run: bash scripts/ci/run-audit-check.sh diagnostics-runner python3 scripts/ci/check-diagnostics-runner.py
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
      - name: Actual HTTP streaming, cancellation, concurrent accounting and real SQLite contention
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh diagnostics-core bash scripts/ci/run-go-tests.sh -race -coverprofile=ci-artifacts/diagnostics-core.cover
          ./internal/diagnostics
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
      - name: Real Connect authentication, panic recovery, administrator access and queue saturation
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh diagnostics-integration bash scripts/ci/run-go-tests.sh -race -run '^TestDiagnostics' ./web/connect
          ./database/metricstore ./web/workspace ./internal/trustedcredential
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
      - name: Real session orphan cleanup, sibling consumers and grant revocation
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh workspace-session bash scripts/ci/run-go-tests.sh -race ./web/remotemanagement ./web/workspace
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
      - name: Actual committed wake, signed watch heartbeats and live credential revocation
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh workspace-watch bash scripts/ci/run-go-tests.sh -race -run 'TestRescueWatch|TestWorkspaceCommitted'
          ./web/connect ./database/privilegeddelivery
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
      - name: Actual SQLite read-only enforcement and existing approval state transitions
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh workspace-read-path bash scripts/ci/run-go-tests.sh -race ./database/privilegeddelivery
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
      - name: Measure HTTP instrumentation allocations and CPU overhead against uninstrumented handler
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh diagnostics-benchmark go test -run '^$' -bench '^BenchmarkDiagnosticsHTTP$' -benchmem -benchtime=500ms
          -count=3 ./internal/diagnostics
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
      - name: Require non-skipped assertion evidence and enforce fixed measured overhead budgets
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh diagnostics-evidence python3 scripts/ci/check-diagnostics-results.py ci-artifacts
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
      - name: Retain all commands, raw Go JSON, stderr, human logs, coverage and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: error
    needs: credentials
