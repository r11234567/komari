name: Private-site entry acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: entry-boundary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      KOMARI_SECRET_KEY: isolated-entry-boundary-ci-key
      KOMARI_TRUSTED_PROXIES: none
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unified static acceptance of the changed entry stack
        run: |
          git diff --check
          test -z "$(git ls-files -z -- 'pkg/requestmeta/*.go' 'utils/requestscheme/*.go' 'utils/httpsserver/*.go' 'internal/plugin/*.go' 'cmd/*.go' 'web/security/*.go' 'web/api/*.go' 'web/connect/*.go' | xargs -0 gofmt -l)"
          go vet ./pkg/requestmeta ./utils/requestscheme ./utils/httpsserver ./internal/plugin ./cmd ./web/security ./web/api ./web/connect
          node scripts/ci/check-protocol.cjs --resolve-go
      - name: Complete entry and authentication regressions with the race detector
        run: bash scripts/ci/run-audit-check.sh entry-regressions bash scripts/ci/run-go-tests.sh -race ./pkg/requestmeta ./utils/requestscheme ./utils/httpsserver ./internal/plugin ./cmd ./web/security ./web/api ./web/connect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-unit-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: error

  nginx-browser-agent:
    needs: static-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
      NODE_OPTIONS: --max-old-space-size=4096
      KOMARI_E2E_SKIP_CSV: '1'
      KOMARI_TRUSTED_PROXIES: 127.0.0.1,::1
      KOMARI_PUBLIC_ORIGIN: https://127.0.0.1:29443
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Read the exact Agent revision
        id: agent
        run: |
          revision=$(cat scripts/ci/entry-agent-revision.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: r11234567/komari-agent
          ref: ${{ steps.agent.outputs.revision }}
          path: e2e-agent
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve isolated fixture paths
        run: |
          printf 'E2E_ROOT=%s/komari-e2e\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'E2E_TOOLS=%s/komari-e2e-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'E2E_ARTIFACTS=%s/ci-artifacts/e2e\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Verify all four source and protocol revisions
        env:
          E2E_EXPECTED_SERVER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          E2E_EXPECTED_AGENT_SHA: ${{ steps.agent.outputs.revision }}
        run: bash scripts/ci/e2e/provenance.sh
      - uses: ./.github/actions/build-frontend
      - name: Build the actual server and installed Agent
        run: bash scripts/ci/run-audit-check.sh entry-build bash scripts/ci/e2e/build.sh
      - name: Install reverse proxy and browser
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx libnss3-tools
          npm install --prefix "$E2E_TOOLS" --no-audit --no-fund --no-package-lock @playwright/test@1.56.1
          "$E2E_TOOLS/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start only the Komari fixture
        run: bash scripts/ci/run-audit-check.sh entry-setup bash scripts/ci/e2e/setup.sh
      - name: Private-site native login, actual Agent enrollment and rejection boundaries
        env:
          NODE_PATH: ${{ runner.temp }}/komari-e2e-tools/node_modules
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/komari-e2e/tls/ca.crt
        run: bash scripts/ci/run-audit-check.sh entry-e2e node scripts/ci/e2e/entry-boundary.cjs
      - name: Collect diagnostics and remove the disposable fixture
        if: always()
        run: bash scripts/ci/e2e/cleanup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-e2e-${{ github.run_id }}
          path: ci-artifacts/
          retention-days: 7
          if-no-files-found: error
