name: Lite billing and expiry checkpoint
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: FX migration, exact conversion, zero fees, cache regressions and expiry timezone/DST
        run: bash scripts/ci/run-audit-check.sh lite-billing bash scripts/ci/run-go-tests.sh -race ./database/billing ./database/clients ./database/dbcore ./pkg/expiry ./utils/renewal ./utils/notifier ./web/api/admin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lite-billing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
