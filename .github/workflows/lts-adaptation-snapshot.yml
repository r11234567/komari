name: Publish LTS Snapshot

on:
  push:
    branches:
      - 1.2.5-LTS
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: komari-web branch, tag, or commit to include
        required: false
        default: 1.2.5-LTS2-web

permissions:
  contents: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # Every LTS commit gets a snapshot. Runs for older commits must not be
  # cancelled when another commit reaches the branch.
  group: lts-snapshot-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      docker_tag: ${{ steps.version.outputs.docker_tag }}
    steps:
      - name: Validate snapshot source
        env:
          EXPECTED_REF: refs/heads/1.2.5-LTS
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" != "${EXPECTED_REF}" ]; then
            echo "Automatic LTS snapshots must run from ${EXPECTED_REF}; current ref is ${GITHUB_REF}."
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${GITHUB_REF}" in
              refs/heads/*)
                echo "Manual snapshot requested from ${GITHUB_REF}."
                ;;
              *)
                echo "Manual LTS snapshots must target a branch; current ref is ${GITHUB_REF}."
                exit 1
                ;;
            esac
          fi

      - name: Generate snapshot version
        id: version
        run: |
          set -euo pipefail
          # Snapshot-YYYYMMDD-HHMMSS in UTC+8, matching the release timezone.
          VERSION="Snapshot-$(date -u -d '+8 hours' +%Y%m%d-%H%M%S)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${VERSION,,}" >> "$GITHUB_OUTPUT"

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v5

      - name: Build frontend artifact
        uses: ./.github/actions/build-frontend
        with:
          repository: https://github.com/r11234567/komari-web.git
          ref: ${{ inputs.frontend_ref || '1.2.5-LTS2-web' }}
          artifact-name: komari-frontend

      - name: Lint frontend
        working-directory: komari-web
        run: npm run lint

  verify-go:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v5

      - name: Restore frontend artifact
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: |
          set -euo pipefail
          UNFORMATTED="$(find . -name '*.go' -not -path './komari-web/*' -print0 | xargs -0 gofmt -l)"
          if [ -n "${UNFORMATTED}" ]; then
            echo "The following Go files need gofmt:"
            echo "${UNFORMATTED}"
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

  build-binaries:
    needs: [prepare, build-frontend, verify-go]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            zig_target: x86_64-windows-gnu
            extension: .exe
          - goos: windows
            goarch: arm64
            zig_target: aarch64-windows-gnu
            extension: .exe
          - goos: windows
            goarch: "386"
            zig_target: x86-windows-gnu
            extension: .exe
          - goos: linux
            goarch: amd64
            zig_target: x86_64-linux-musl
            extension: ""
          - goos: linux
            goarch: arm64
            zig_target: aarch64-linux-musl
            extension: ""
          - goos: linux
            goarch: "386"
            zig_target: x86-linux-musl
            extension: ""
          - goos: linux
            goarch: riscv64
            zig_target: riscv64-linux-musl
            extension: ""
    steps:
      - name: Checkout backend
        uses: actions/checkout@v5

      - name: Restore frontend artifact
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Zig cross-compiler toolchain
        uses: ./.github/actions/setup-zig

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target }}
          GIN_MODE: release
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          BINARY="komari-${GOOS}-${GOARCH}${{ matrix.extension }}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${GITHUB_SHA}" \
            -o "${BINARY}" .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: komari-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komari-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}

  publish-snapshot:
    needs: [prepare, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v5
        with:
          pattern: komari-*
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: sha256sum komari-* > SHA256SUMS

      - name: Create snapshot prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          FRONTEND_REF: ${{ inputs.frontend_ref || '1.2.5-LTS2-web' }}
        run: |
          set -euo pipefail
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes "Automated LTS snapshot from backend ${GITHUB_SHA} and komari-web ${FRONTEND_REF}. Built at the UTC+8 timestamp in the version. Not for production." \
            --prerelease \
            artifacts/komari-* artifacts/SHA256SUMS

  publish-docker:
    needs: [prepare, build-binaries, publish-snapshot]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Docker binaries
        uses: actions/download-artifact@v5
        with:
          pattern: komari-linux-*
          path: .
          merge-multiple: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.docker_tag }}
            type=raw,value=1.2.5-lts-snapshot

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          provenance: false
