name: MoeJS runtime and RPC2 boundary checkpoint
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moejs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve migration dependency metadata on the hosted runner
        run: bash scripts/ci/run-audit-check.sh dependencies go mod tidy
      - name: MoeJS native modules, deadlines, async lifecycle and sandbox regressions
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh moejs bash scripts/ci/run-go-tests.sh ./pkg/jsruntime/... ./internal/plugin ./internal/notifications ./internal/managedconfig ./utils/messageSender/...
      - name: RPC2 allowlist, roles and workspace credential isolation
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh gateway bash scripts/ci/run-go-tests.sh ./pkg/rpc ./web/rpc/jsonrpc ./web/workspace ./web/connect
      - name: Repeat fast-child output and close-order regression
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh child-output bash scripts/ci/run-go-tests.sh -count=20 -run 'TestChildProcessPermissionAndExecution|TestChildSpawnCloseWaitsForBothStreams' ./pkg/jsruntime
      - name: Require committed dependency metadata
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh dependency-diff git diff --exit-code -- go.mod go.sum
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moejs-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/
            go.mod
            go.sum
          retention-days: 30
