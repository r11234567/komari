name: Plugin subsystem regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_security_only:
        description: Run focused package admission, native 2FA and archive regressions
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: plugin-subsystem-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plugin-subsystem:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Plugin subsystem, JS runtime, notifications and RPC gateway regression
        if: ${{ inputs.package_security_only != true }}
        run: scripts/ci/run-go-tests.sh ./internal/plugin ./internal/plugingateway ./web/connect ./pkg/jsruntime ./utils/messageSender ./web/rpc/jsonrpc
      - name: Focused package admission and real native 2FA regressions
        if: ${{ inputs.package_security_only == true }}
        run: |
          scripts/ci/run-go-tests.sh -race ./internal/plugin ./internal/plugingateway ./web/api/admin
          scripts/ci/run-go-tests.sh -race -run 'Test(PluginPackage|Policy)' ./web/connect
      - name: Preserve complete logs, including compiler failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-subsystem-ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 30
