name: QGA forensic archive E2E

on:
  pull_request:
    paths:
      - '.github/workflows/qga-forensic-archive-e2e.yml'
      - 'scripts/ci/e2e/forensic-vms*'
      - 'cmd/forensic_verify*.go'
      - 'internal/diagnosticrecords/**'
      - 'database/privilegeddelivery/**'
      - 'web/connect/privileged*.go'
      - 'web/connect/sealed_records*.go'
      - 'third_party/komari-proto'
      - 'third_party/komari-web'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-two-guests:
    name: Two Ubuntu guests / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: forensic
            name: QGA, owner approval, signed archive and browser
          - scenario: root-approval
            name: remote root privilege transition and browser
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: r11234567/komari-agent
          ref: a1584e8b780f1ec56c68c38c51adf15e745cf9a3
          path: e2e-agent
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: e2e-agent/go.mod
          cache-dependency-path: |
            go.sum
            e2e-agent/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all protocol and source revisions
        run: |
          export E2E_ROOT="$RUNNER_TEMP/komari-e2e" E2E_TOOLS="$RUNNER_TEMP/komari-e2e-tools"
          export E2E_ARTIFACTS="$GITHUB_WORKSPACE/ci-artifacts/e2e"
          bash scripts/ci/e2e/provenance.sh
      - name: Build the exact Web embedded by the panel
        uses: ./.github/actions/build-frontend
        with:
          audit-artifact-suffix: -${{ matrix.scenario }}
      - name: Install virtual machine, terminal and browser tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends acl cloud-image-utils netcat-openbsd nginx openssh-client python3-pexpect qemu-system-x86 qemu-utils ubuntu-keyring
          if [[ -c /dev/kvm ]]; then sudo setfacl -m "u:$(id -u):rw" /dev/kvm; fi
          npm install --prefix "$RUNNER_TEMP/forensic-tools" --no-audit --no-fund --no-package-lock @playwright/test@1.56.1
          "$RUNNER_TEMP/forensic-tools/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: Fetch and verify the signed Ubuntu guest image
        run: bash e2e-agent/scripts/qga-e2e/fetch-ubuntu.sh
      - name: Verify the full two-guest workflow with synthetic data
        env:
          NODE_PATH: ${{ runner.temp }}/forensic-tools/node_modules
        run: |
          bash scripts/ci/e2e/forensic-vms.sh e2e-agent \
            e2e-agent/scripts/qga-e2e/fixtures/ubuntu/noble-server-cloudimg-amd64.img ${{ matrix.scenario }}
