name: Terminal workbench regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terminal-workbench-${{ github.ref }}
  cancel-in-progress: false
jobs:
  terminal-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Check local protocol dependency and bump regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          node --test scripts/ci/protocol-submodule.test.cjs 2>&1 | tee ci-artifacts/protocol-tests.log
          node scripts/ci/check-protocol.cjs --resolve-go 2>&1 | tee ci-artifacts/protocol-source.log
      - name: Terminal WebSSH, remote management and Connect settings regression
        run: scripts/ci/run-go-tests.sh ./web/connect ./web/agent ./web/api/terminal ./web/remotemanagement
      - name: Frontend terminal workbench, clipboard and file manager integration tests
        shell: bash
        run: |
          set -euo pipefail
          cd third_party/komari-web
          npm ci
          node --test tests/terminalWorkbench.test.ts tests/terminalClipboard.test.ts tests/fileManagerWorkbench.test.ts 2>&1 | tee ../../ci-artifacts/frontend-workbench-tests.log
      - name: Preserve complete logs, including compiler failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-workbench-ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 30
