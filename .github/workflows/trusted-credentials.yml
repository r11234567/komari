name: Trusted credentials checkpoint
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Public theme password submission, failure handling and factor handoff (no browser E2E)
        run: bash scripts/ci/run-audit-check.sh public-login-bridge node --test scripts/ci/native-login-bridge.test.cjs
      - name: Public theme bridge and native login document isolation
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh public-login-document bash scripts/ci/run-go-tests.sh ./web/public
      - name: Resolve fixed WebAuthn dependency metadata on the runner
        run: bash scripts/ci/run-audit-check.sh credential-dependencies go mod tidy
      - name: Passkey public-record compatibility and independent signature verification
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-passkey bash scripts/ci/run-go-tests.sh -race ./internal/passkeycredential
      - name: Challenge, scope, expiry, quotas and concurrent consumption
        run: bash scripts/ci/run-audit-check.sh credential-core bash scripts/ci/run-go-tests.sh -race ./internal/trustedcredential ./internal/credentialgateway
      - name: Eight-character OTP and consecutive successful workspace verifications (synthetic only)
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh otp-followup bash scripts/ci/run-go-tests.sh -race -run 'TestNativeOTPFormatIncludesLettersAndDigits|TestSuccessfulOTPAllowsNextActionImmediately|TestSuccessfulWorkspaceReauthorizationsDoNotSpendFailureBudget' ./internal/notificationotp ./internal/trustedcredential
      - name: Native TOTP adapter, session invalidation and typed Connect gateway
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-connect bash scripts/ci/run-go-tests.sh ./web/connect ./database/accounts
      - name: Password and second-factor login checkpoint (synthetic delivery only)
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh password-login bash scripts/ci/run-go-tests.sh -race -run TestPassword ./internal/credentialgateway ./web/connect ./web/api/public
      - name: Native credential workspace and account consumers (synthetic only)
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-actions bash scripts/ci/run-go-tests.sh -race ./internal/credentialaction ./internal/credentialgateway ./web/connect
      - name: Native notification OTP and private transport isolation (synthetic only)
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh native-otp bash scripts/ci/run-go-tests.sh -race ./internal/notificationotp ./utils/messageSender/...
      - name: Internal RPC compatibility, public allowlist and existing login boundaries
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-compat bash scripts/ci/run-go-tests.sh ./pkg/rpc ./web/rpc/jsonrpc ./web/api ./web/signonauth ./web/workspace ./internal/plugingateway
      - name: Require committed dependency metadata
        if: ${{ !cancelled() }}
        run: bash scripts/ci/run-audit-check.sh credential-dependency-diff git diff --exit-code -- go.mod go.sum
      - name: Retain complete logs, test JSON and exit codes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-credentials-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/
            go.mod
            go.sum
          retention-days: 30
