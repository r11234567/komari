name: Exact Web dependency gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-web-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Require every independent Web workflow on the exact gitlink
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/run-audit-check.sh web-workflows python3 scripts/ci/check-web-workflows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-workflow-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: error
