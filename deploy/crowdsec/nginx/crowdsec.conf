# Replace the old global bouncer hook. Keep the private bouncer key file.
lua_package_path '/usr/lib/crowdsec/lua/?.lua;;';
lua_shared_dict crowdsec_cache 50m;
lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
init_by_lua_block {
    cs = require "crowdsec"
    local ok, err = cs.init("/etc/crowdsec/bouncers/crowdsec-nginx-bouncer.conf", "komari-nginx-bouncer")
    if ok == nil then error(err) end
}
init_worker_by_lua_block {
    if string.lower(cs.get_mode()) == "stream" then cs.SetupStream() end
    if ngx.worker.id() == 0 then cs.SetupMetrics() end
}
access_by_lua_block {
    if ngx.var.komari_local_request == "1" then return end
    if ngx.var.komari_panel_host == "1" and ngx.var.komari_machine_route == "1" then return end
    cs.Allow(ngx.var.remote_addr)
}
