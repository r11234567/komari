# Include once inside http {}. Replace the hostname and backend address.
map_hash_bucket_size 256;
upstream komari_backend {
    server 127.0.0.1:25774;
    keepalive 32;
}
map $host $komari_panel_host {
    default 0;
    panel.example.com 1;
}
geo $komari_local_request {
    default 0;
    127.0.0.0/8 1;
    ::1 1;
}
map $upstream_http_x_komari_principal $komari_log_principal {
    default anonymous;
    agent agent;
    user user;
    api-key api-key;
}
include /etc/nginx/komari/rpc-map.conf;
# No query strings, bearer credentials, cookies or client-supplied identity.
log_format komari_security escape=default '$remote_addr - - [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"-" "$http_user_agent" "$komari_log_principal" "$komari_route_class" "$limit_req_status"';
