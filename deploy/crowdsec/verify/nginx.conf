include /etc/nginx/modules-enabled/*.conf;
pid /tmp/komari-verify.pid;
events {}
http {
    include /etc/nginx/komari/http.conf;
    include /etc/nginx/komari/crowdsec.conf;
    map $http_authorization $test_principal {
        default anonymous;
        "Bearer synthetic" agent;
    }
    server {
        listen 127.0.0.1:25774;
        add_header X-Komari-Principal $test_principal always;
        location ~ ^/komari\. {
            if ($http_authorization != "Bearer synthetic") { return 401; }
            return 200 "$http_x_forwarded_for";
        }
        location / { return 200 "$http_x_forwarded_for"; }
    }
    server {
        listen 8080;
        server_name panel.example.com;
        set_real_ip_from 127.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        real_ip_header X-Test-Source;
        include /etc/nginx/komari/server.inc;
    }
}
