# Komari Dual-Listener Split-Origin Deployment (Phase 3A / ADR-2)
#
# Run Komari with physical listener isolation enabled:
#   KOMARI_LISTEN=127.0.0.1:25774
#   KOMARI_PANEL_LISTEN=127.0.0.1:25775
#   KOMARI_PUBLIC_ORIGIN=https://status.example.com
#   KOMARI_PANEL_ORIGIN=https://panel.example.com
#   KOMARI_PASSKEY_RP_ID=example.com
#   KOMARI_TRUSTED_PROXIES=127.0.0.1/32,::1/128
#
# Passkey migration note:
#   When KOMARI_PASSKEY_RP_ID is set to the registrable root domain (example.com),
#   moving the management console onto https://panel.example.com only updates the
#   allowed origin (KOMARI_PANEL_ORIGIN) and preserves existing Passkey credentials.
#   If a deployment previously locked KOMARI_PASSKEY_RP_ID to status.example.com,
#   sign in on https://panel.example.com with a backup factor first and register
#   a new Passkey under the updated RP ID.

map $http_upgrade $komari_connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Public Status & Third-Party Theme Origin (safe behind CDN / Cloudflare orange cloud)
#    Serves only public themes, read-only public Connect queries, and bounded read-only
#    RPC2/REST/WS compatibility endpoints under forced PublicViewer projection.
#    /admin, /login, /terminal, /bind, Passkeys, and Agent control RPCs are unmounted (404).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.example.com;

    ssl_certificate     /etc/nginx/ssl/status.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/status.example.com.key;

    location / {
        proxy_pass http://127.0.0.1:25774;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $komari_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# 2. Dedicated Management & Agent Control Origin
#    Can be hardened independently with Cloudflare Access, mTLS, VPN, or IP allowlists.
#    Serves only embedded trusted systemUI, __Host-komari_session + step-up RPCs, and
#    DPoP-authenticated Agent Connect streams. Third-party themes and /api/rpc2 return 404.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/nginx/ssl/panel.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/panel.example.com.key;

    client_max_body_size 128m;

    # Bidi HTTP/2 streams for Agent terminal and file data planes
    location ~ ^/komari\.(webssh\.v1\.WebSSHService/AttachSession|file\.v1\.FileService/AttachFileOperations)$ {
        grpc_pass grpc://127.0.0.1:25775;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_set_header X-Forwarded-Host $host;
        grpc_read_timeout 7200s;
        grpc_send_timeout 7200s;
    }

    location / {
        proxy_pass http://127.0.0.1:25775;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $komari_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
