# Include inside a server block. Define an http-level upstream named
# komari_backend pointing to Komari's HTTP/h2c listener first.
# Bidirectional Connect needs HTTP/2 on BOTH sides of the proxy.
location ~ ^/(komari\.webssh\.v1\.WebSSHService/(AttachSession|OpenSession)|komari\.file\.v1\.FileService/AttachFileOperations)$ {
    grpc_pass grpc://komari_backend;
    grpc_set_header Host $host;
    grpc_set_header X-Real-IP $remote_addr;
    grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    grpc_set_header X-Forwarded-Proto $scheme;
    grpc_connect_timeout 5s;
    grpc_read_timeout 35m;
    grpc_send_timeout 35m;
    client_max_body_size 4m;
}

# Browser commands and Agent lease streams need prompt flushing too. Keep
# these exact service families separate from RPC2/plugin gateway locations.
location ~ ^/(komari\.webssh\.v1\.WebSSHService|komari\.file\.v1\.FileService)/ {
    proxy_pass http://komari_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 35m;
    proxy_send_timeout 35m;
    client_max_body_size 4m;
}
